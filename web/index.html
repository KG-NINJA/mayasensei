<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZTEC3 — 翡翠の手帳と太陽の記憶</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee7d3;color:#284b42;font-family:system-ui,sans-serif}#canvas{display:block;outline:none;width:100%;height:100%}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#eee7d3}h1{font-size:64px;letter-spacing:.08em;margin:0 0 12px}p{line-height:1.8}progress{width:320px;max-width:85vw;accent-color:#365f50}#error{max-width:620px;white-space:pre-wrap}a{color:#365f50}</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head><body><canvas id="canvas" tabindex="0" aria-label="AZTEC3 ゲーム画面"></canvas>
<div id="loading"><h1>AZTEC3</h1><p>翡翠の手帳と太陽の記憶<br>旅の記録をひらいています…</p><progress id="progress"></progress><p id="error"></p><p><a href="../">配布ページへ戻る</a></p></div>
<noscript>JavaScriptを有効にしてください。</noscript><script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7149896,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const progress = document.getElementById('progress');
const missing = Engine.getMissingFeatures({threads:false});
function failure(error){document.getElementById('error').textContent='起動できませんでした。WebGL 2.0対応のブラウザーで開き直すか、PC版をお使いください。\n'+String(error);console.error(error);}
if(missing.length){failure(missing.join(', '));}else{
engine.startGame({canvas:document.getElementById('canvas'),args:new URLSearchParams(location.search).has('verify')?['--','--verify']:[],onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;}}}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus();},failure);
}
</script></body></html>
